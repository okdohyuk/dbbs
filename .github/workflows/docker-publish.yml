name: docker-publish

# Build and push the DBBS image to Docker Hub when a semver tag is pushed
# (e.g. `git tag v1.0.0 && git push origin v1.0.0`). Manual runs push a
# commit-sha-tagged image.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE: okdohyuk/dbbs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish a GitHub Release for the tag once the image is on Docker Hub.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DBBS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### Docker image
            ```bash
            docker pull ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            docker pull ${{ env.IMAGE }}:latest
            ```
            Multi-arch (linux/amd64, linux/arm64) · [Docker Hub tags](https://hub.docker.com/r/okdohyuk/dbbs/tags)
