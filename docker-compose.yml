services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://dbbs:dbbs@meta-db:5432/dbbs
      DBBS_MASTER_KEY: ${DBBS_MASTER_KEY:-dev-only-master-secret-change-me}
      # Set DBBS_PASSWORD to enable the login gate (empty = open, no login).
      DBBS_PASSWORD: ${DBBS_PASSWORD:-}
      SNAPSHOT_DIR: /data/snapshots
      NODE_ENV: production
    volumes:
      - ./snapshots:/data/snapshots
    depends_on:
      meta-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  meta-db:
    image: postgres:16
    environment:
      POSTGRES_USER: dbbs
      POSTGRES_PASSWORD: dbbs
      POSTGRES_DB: dbbs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbbs -d dbbs"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Demo backup source (seeded with tables, data, a stored procedure) ──
  mysql-a:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3307:3306"
    volumes:
      - mysqla_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 24

  # ── Demo restore target (empty server, different host than A) ──
  mysql-b:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysqlb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  pgdata:
  mysqla_data:
  mysqlb_data:
